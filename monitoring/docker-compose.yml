services:
  node-exporter:            # reads the server's numbers
    image: quay.io/prometheus/node-exporter:latest
    command:
      - --path.rootfs=/host
    network_mode: host      # real network
    pid: host               # real processes
    volumes:
      - /:/host:ro,rslave   # whole server, read-only (CPU, RAM, disk, battery 🔋)
    restart: unless-stopped

  prometheus:               # stores the numbers
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # = the server itself
    restart: unless-stopped

  grafana:                  # graphs + alerts
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
